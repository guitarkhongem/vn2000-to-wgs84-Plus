<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng dẫn sử dụng</title>
<meta name="description" content="Hướng dẫn sử dụng ứng dụng chuyển đổi toạ độ VN-2000 ⇄ WGS84.">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css?v=2026.11.27h">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  body { overflow-y: auto; }
  .doc { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; }
  .doc-top {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .doc-top .brand h1 { font-size: 18px; }
  .content { line-height: 1.65; font-size: 15px; }
  .content h1 { font-size: 26px; margin: 16px 0 8px; letter-spacing: -.01em; }
  .content h2 { font-size: 19px; margin: 32px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
  .content h3 { font-size: 16px; margin: 20px 0 6px; }
  .content p, .content li { color: var(--text); }
  .content a { color: var(--accent); }
  .content code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }
  .content blockquote {
    margin: 12px 0; padding: 8px 12px; border-left: 4px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  .content blockquote p { margin: 0; }
  .content table { display: block; overflow-x: auto; font-size: 14px; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
  .content th, .content td { text-align: left; white-space: normal; padding: 8px 10px; vertical-align: top; }
  .content thead th { position: static; }
  .content tbody tr { cursor: default; }
  .content tbody tr:hover { background: transparent; }
  .content hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0 12px; }
  .toc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  .toc strong { font-size: 13px; }
  .toc ol { margin: 6px 0 0; padding-left: 20px; columns: 2; column-gap: 24px; font-size: 14px; }
  .toc a { color: var(--text); text-decoration: none; }
  .toc a:hover { color: var(--accent); }
  @media (max-width: 600px) { .toc ol { columns: 1; } }
</style>
</head>
<body>
<div class="doc">
  <div class="doc-top">
    <a class="brand" href="./" style="text-decoration:none;color:inherit">
      <img src="assets/logo.jpg" alt="" width="36" height="36">
      <div><h1>VN2000 ⇄ WGS84</h1><p>Hướng dẫn sử dụng</p></div>
    </a>
    <a class="btn primary" href="./">Mở ứng dụng</a>
  </div>
  <nav id="toc" class="toc" hidden><strong>Mục lục</strong><ol></ol></nav>
  <article id="content" class="content"><p class="muted">Đang tải hướng dẫn…</p></article>
</div>
<script>
(async function () {
  const box = document.getElementById("content");
  try {
    // Nguồn duy nhất: HUONG_DAN.md (cùng thư mục). Cần chạy qua http(s), không chạy được bằng file://
    const res = await fetch("HUONG_DAN.md", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    box.innerHTML = marked.parse(await res.text());
  } catch (_) {
    box.innerHTML = '<p>Không tải được hướng dẫn. Xem bản gốc tại ' +
      '<a href="https://github.com/guitarkhongem/vn2000-to-wgs84-Plus/blob/main/docs/HUONG_DAN.md">GitHub</a>.</p>';
    return;
  }
  // Tạo mục lục từ các tiêu đề cấp 2
  const ol = document.querySelector("#toc ol");
  box.querySelectorAll("h2").forEach((h, i) => {
    // Mục "Nguồn dữ liệu" có id cố định để các trang khác liên kết tới (#nguon-du-lieu)
    h.id = /Nguồn dữ liệu/i.test(h.textContent) ? "nguon-du-lieu" : "muc-" + (i + 1);
    const li = document.createElement("li");
    li.innerHTML = `<a href="#${h.id}">${h.textContent.replace(/^\d+\.\s*/, "")}</a>`;
    ol.appendChild(li);
  });
  if (ol.children.length) document.getElementById("toc").hidden = false;
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script>
</body>
</html>
