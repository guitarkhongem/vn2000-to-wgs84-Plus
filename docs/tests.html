<script>
/* Giá trị chốt lấy từ thuật toán Python (tests/test_converter.py) — hai bản phải khớp. */
const results = [];
function test(name, fn) {
  try { fn(); results.push([name, true, ""]); }
  catch (e) { results.push([name, false, e.message]); }
}
function near(a, b, tol, label) {
  if (!(Math.abs(a - b) <= tol)) throw new Error(`${label}: ${a} ≠ ${b} (sai số cho phép ${tol})`);
}
function eq(a, b, label) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error(`${label}: ${A} ≠ ${B}`);
}

const LON0 = 106.25;
const SAMPLES = [[1850000, 520000, 10], [1840000, 480000, 300], [1860500, 505250, 0]];

test("Kết quả chốt khớp bản Python", () => {
  for (const [x, y, h, lat, lon] of [
    [1850000, 520000, 10, 16.72672282, 106.43940148],
    [1840000, 480000, 300, 16.63635531, 106.06435322],
  ]) {
    const r = VN.vn2000ToWgs84(x, y, h, LON0);
    near(r[0], lat, 1e-7, "lat"); near(r[1], lon, 1e-7, "lon");
  }
});

test("Khứ hồi VN2000 → WGS84 → VN2000 sai số < 5 mm", () => {
  for (const [x, y, h] of SAMPLES) {
    const [lat, lon, hw] = VN.vn2000ToWgs84(x, y, h, LON0);
    const [x2, y2, h2] = VN.wgs84ToVn2000(lat, lon, hw, LON0);
    near(x2, x, 0.005, "x"); near(y2, y, 0.005, "y"); near(h2, h, 0.005, "h");
  }
});

test("Điểm trên kinh tuyến trục", () => {
  near(VN.vn2000ToWgs84(1850000, 500000, 0, LON0)[1], LON0, 0.01, "lon");
});

test("parseCoordinates: STT X Y H", () => {
  const r = VN.parseCoordinates("1 1850000 520000 10");
  eq(r.points, [["1", 1850000, 520000, 10]], "points"); eq(r.errors, [], "errors");
});
test("parseCoordinates: dòng trống không làm hỏng", () => {
  eq(VN.parseCoordinates("1 1850000 520000 10\n\n2 1850010 520010 10").points.map(p => p[0]), ["1", "2"], "tên");
});
test("parseCoordinates: định dạng N/E", () => {
  eq(VN.parseCoordinates("N01850000 E00520000").points[0].slice(1, 3), [1850000, 520000], "xy");
});
test("parseCoordinates: loại điểm ngoài miền", () => {
  const r = VN.parseCoordinates("1 100 200 0");
  eq(r.points, [], "points"); eq(r.errors.length, 1, "errors");
});
test("parseCoordinates: X=/Y= tự đảo khi nhập ngược", () => {
  eq(VN.parseCoordinates("X=520000\nY=1850000").points[0].slice(1, 3), [1850000, 520000], "xy");
});
test("parseCoordinates: 3 dòng đơn", () => {
  eq(VN.parseCoordinates("1850000\n520000\n10").points, [["Điểm 1", 1850000, 520000, 10]], "points");
});

test("parseWgs84: lat lon không có H", () => {
  const r = VN.parseWgs84("16.70 106.60\n16.71 106.61");
  eq(r.points, [["1", 16.7, 106.6, 0], ["2", 16.71, 106.61, 0]], "points"); eq(r.errors, [], "errors");
});
test("parseWgs84: có H và tên", () => {
  eq(VN.parseWgs84("M1 16.70 106.60 12.5\nM2, 16.71, 106.61").points,
     [["M1", 16.7, 106.6, 12.5], ["M2", 16.71, 106.61, 0]], "points");
});
test("parseWgs84: báo lỗi dòng sai", () => {
  const r = VN.parseWgs84("16.70 106.60\nabc\n95 106.6");
  eq(r.points.length, 1, "points"); eq(r.errors.length, 2, "errors");
});

test("Shoelace: hình vuông 20 m = 400 m²", () => {
  near(VN.shoelaceArea([[0, 0], [20, 0], [20, 20], [0, 20]]), 400, 1e-9, "area");
});
test("Diện tích WGS84 ≈ diện tích VN2000 (thửa 100 m × 100 m)", () => {
  const xy = [[1850000, 520000], [1850100, 520000], [1850100, 520100], [1850000, 520100]];
  const ll = xy.map(([x, y]) => VN.vn2000ToWgs84(x, y, 0, LON0).slice(0, 2));
  const a1 = VN.shoelaceArea(xy), a2 = VN.geodesicArea(ll);
  near(a2 / a1, 1, 0.002, "tỉ lệ");   // khác nhau do hệ số k0 & biến dạng phép chiếu
});
test("Độ dài cạnh WGS84 ≈ 100 m", () => {
  const [a, b] = [[1850000, 520000], [1850100, 520000]].map(([x, y]) => VN.vn2000ToWgs84(x, y, 0, LON0));
  near(VN.geodesicDistance(a[0], a[1], b[0], b[1]), 100, 0.05, "s12");
});
test("Điểm trong đa giác (có lỗ, MultiPolygon)", () => {
  const sq = (a, b) => [[a, a], [b, a], [b, b], [a, b], [a, a]];
  const poly = { type: "Polygon", coordinates: [sq(0, 10), sq(4, 6)] };   // vuông 10×10, lỗ 2×2 ở giữa
  eq(VN.pointInGeometry(1, 1, poly), true, "trong");
  eq(VN.pointInGeometry(5, 5, poly), false, "trong lỗ");
  eq(VN.pointInGeometry(11, 5, poly), false, "ngoài");
  const multi = { type: "MultiPolygon", coordinates: [[sq(0, 1)], [sq(5, 6)]] };
  eq(VN.pointInGeometry(5.5, 5.5, multi), true, "phần thứ 2");
});
test("Vòng tròn trắc địa: mọi điểm cách tâm đúng bán kính, diện tích ≈ πr²", () => {
  const [lat, lon] = [16.6556, 106.6853];
  for (const r of [10, 150, 2000]) {
    const ring = VN.geodesicCircle(lat, lon, r, 64);
    eq(ring.length, 65, "số điểm");
    eq(JSON.stringify(ring[0]) === JSON.stringify(ring[64]), true, "khép kín");
    for (const [x, y] of ring) near(VN.geodesicDistance(lat, lon, y, x), r, 1e-6, `khoảng cách R=${r}`);
    const area = VN.geodesicArea(ring.slice(0, -1).map(([x, y]) => [y, x]));
    near(area / (Math.PI * r * r), 1, 0.002, `diện tích R=${r}`);   // đa giác 64 cạnh ≈ 0,16 % nhỏ hơn
  }
});
test("findFeature: tìm vùng chứa điểm (lọc khung bao, MultiPolygon)", () => {
  const sq = (a, b) => [[a, a], [b, a], [b, b], [a, b], [a, a]];
  const feats = [
    { properties: { ten: "A" }, geometry: { type: "Polygon", coordinates: [sq(0, 10)] } },
    { properties: { ten: "B" }, geometry: { type: "MultiPolygon", coordinates: [[sq(20, 21)], [sq(30, 31)]] } },
  ];
  eq(VN.findFeature(5, 5, feats).properties.ten, "A", "A");
  eq(VN.findFeature(30.5, 30.5, feats).properties.ten, "B", "B phần 2");
  eq(VN.findFeature(15, 15, feats), null, "ngoài");
  eq(Object.keys(feats[0]).includes("_bbox"), false, "_bbox không lộ ra khi JSON hoá");
});

test("Giá đất: màu theo bậc giá, khoảng cách tới đoạn đường, đoạn gần nhất", () => {
  eq(VN.mauGia(500000), "#fff3b0", "< 1 triệu");
  eq(VN.mauGia(13300000), "#9d0208", "10–20 triệu");
  eq(VN.mauGia(45500000), "#5a189a", "≥ 20 triệu");
  // điểm cách đoạn nằm ngang 0,001° vĩ độ ≈ 110,6 m
  near(VN.khoangCachToiDuong(106.0005, 16.0, [[106.0, 16.001], [106.001, 16.001]]), 110.57, 0.5, "khoảng cách");
  // điểm vượt quá đầu mút → tính tới đầu mút
  near(VN.khoangCachToiDuong(106.002, 16.001, [[106.0, 16.001], [106.001, 16.001]]), 107.0, 1, "tới đầu mút");
  const doan = [
    { duong: "A", hinh: [[106.0, 16.001], [106.001, 16.001]] },
    { duong: "B", hinh: [[106.0, 16.0005], [106.001, 16.0005]] },
    { duong: "C", hinh: [[106.1, 16.1], [106.101, 16.1]] },
    { duong: "Không toạ độ" },
  ];
  eq(VN.doanGanNhat(106.0005, 16.0, doan, 300, 5).map((x) => x.d.duong), ["B", "A"], "thứ tự gần → xa, bỏ đoạn xa");
  eq(VN.boDau("Đường Lê Duẩn"), "duong le duan", "bỏ dấu");
});

test("Sắp tên điểm theo số", () => {
  eq(["10", "2", "B", "1", "a"].sort(VN.comparePointNames), ["1", "2", "10", "a", "B"], "thứ tự");
});
test("DXF có đủ thực thể và ghi tên tiếng Việt dạng \\U+", () => {
  const d = VN.toDxf([{ name: "Điểm 1", x: 1850000, y: 520000 }]);
  eq((d.match(/\r\nLINE\r\n/g) || []).length, 2, "LINE");
  if (!d.includes("\\U+0110i\\U+1EC3m 1")) throw new Error("tên không mã hoá đúng");
  if (!d.trim().endsWith("EOF")) throw new Error("thiếu EOF");
});
test("KML đúng thứ tự lon,lat", () => {
  const k = VN.toKml([{ name: "A&B", lat: 16.7, lon: 106.6, hw: 5 }]);
  if (!k.includes("<coordinates>106.6,16.7,5</coordinates>")) throw new Error("toạ độ sai");
  if (!k.includes("A&amp;B")) throw new Error("chưa escape");
});

const out = document.getElementById("out");
test("Lớp từ file: TCVN3 → Unicode, DXF (đường, cung bulge, chữ, khối), số VAX của DGN, đổi toạ độ", () => {
  eq(VN.tcvn3("x\xb7 A D\xaci"), "xã A Dơi", "TCVN3");
  eq(VN.tcvn3("S\xeb T\xb5i nguy\xaan & M\xabi tr\xad\xeang"), "Sở Tài nguyên & Môi trường", "TCVN3 2");
  eq(VN.tcvn3("Thửa 12 · 25°"), "Thửa 12 · 25°", "Unicode giữ nguyên");
  eq(VN.dxfText("(982,6 m\\S2^ ;)"), "(982,6 m²)", "MTEXT mũ");
  const dxf = ["0","SECTION","2","BLOCKS","0","BLOCK","2","B1","10","0","20","0","0","LINE","8","0","10","0","20","0","11","1","21","0","0","ENDBLK",
    "0","ENDSEC","0","SECTION","2","ENTITIES",
    "0","LWPOLYLINE","8","RANH","90","2","70","0","10","0","20","0","42","1","10","2","20","0",
    "0","TEXT","8","CHU","10","5","20","6","40","2.5","50","90","1","Th\xf6a 7",
    "0","INSERT","8","KHOI","2","B1","10","10","20","10","41","2","42","2","50","90",
    "0","ENDSEC","0","EOF"].join("\n");
  const e = VN.parseDxf(dxf);
  eq(e.length, 3, "số đối tượng");
  const arc = e[0].pts;   // nửa đường tròn (bulge 1) từ (0,0) tới (2,0), tâm (1,0)
  near(arc[arc.length - 1][0], 2, 1e-9, "cung: điểm cuối");
  near(Math.min(...arc.map((p) => p[1])), -1, 1e-6, "cung bulge 1 đi qua (1,-1)");
  eq(e[1].text, "Thửa 7", "chữ TCVN3"); near(e[1].h, 2.5, 0, "cao chữ"); near(e[1].rot, 90, 0, "góc chữ");
  near(e[2].pts[1][0], 10, 1e-9, "khối xoay 90°: x"); near(e[2].pts[1][1], 12, 1e-9, "khối tỉ lệ 2: y");
  // VAX D-float: 1.0 = 0x4080 0000 0000 0000 (từ 16 bit little-endian)
  near(VN.vaxDouble(new Uint8Array([0x80, 0x40, 0, 0, 0, 0, 0, 0]), 0), 1, 0, "VAX 1.0");
  near(VN.vaxDouble(new Uint8Array([0x20, 0xc2, 0, 0, 0, 0, 0, 0]), 0), -10, 0, "VAX -10");
  eq(VN.dgnInt32(new Uint8Array([0x01, 0x00, 0x02, 0x00]), 0), 65538, "int32 thứ tự VAX");
  eq(VN.guessCrs([548889, 1840169, 549754, 1841146]), "vn2000", "đoán VN-2000");
  eq(VN.guessCrs([1840169, 548889, 1841146, 549754]), "vn2000-dao", "đoán đảo trục");
  eq(VN.guessCrs([106.5, 16.6, 106.7, 16.8]), "wgs84", "đoán WGS84");
  // đổi toạ độ dùng đúng hàm của ứng dụng: x CAD = Đông (Y), y CAD = Bắc (X)
  const g = VN.cadToGeojson([{ t: "point", layer: "0", pts: [[546243.50, 1842173.70]] }], { crs: "vn2000", lon0: 106.25 });
  const [lat, lon] = VN.vn2000ToWgs84(1842173.70, 546243.50, 0, 106.25);
  near(g[0].geometry.coordinates[0], lon, 0, "kinh độ"); near(g[0].geometry.coordinates[1], lat, 0, "vĩ độ");
});

test("DGN V8: chữ trong phần tử (8 bit TCVN3, Unicode), TCVN3 chữ hoa", () => {
  const b = (arr) => new Uint8Array(arr);
  eq(VN.dgnV8Text(b([0xff, 0xfe, 0x01, 0x00, 0x78, 0xb7, 0x20, 0x41])), "xã A", "8 bit sau FF FE 01 00");
  eq(VN.dgnV8Text(b([0xff, 0xfe, 0x54, 0x00, 0xdd, 0x1e])), "Tờ", "UTF-16 sau FF FE");
  eq(VN.dgnV8Text(b([0x34, 0x33, 0x2c, 0x30, 0x33])), "43,03", "ASCII");
  eq(VN.tcvn3("T\xea S\xe8 56"), "TỜ SỐ 56", "font chữ hoa .VnTimeH");
});

test("Chụp ảnh: ghi rồi đọc lại EXIF GPS, dòng chữ in lên ảnh", () => {
  const t = new Date(2026, 10, 27, 17, 35, 12);
  const j = VN.ghiExif(new Uint8Array([0xff, 0xd8, 0xff, 0xd9]), { lat: 16.6353123, lon: 106.733012, alt: 452.37, time: t, mota: "Thua 12" });
  const r = VN.docExif(j.buffer);
  near(r.lat, 16.6353123, 1e-7, "vĩ độ"); near(r.lon, 106.733012, 1e-7, "kinh độ"); near(r.alt, 452.37, 0.01, "độ cao");
  eq(r.time.getTime(), t.getTime(), "thời gian");
  // EXIF nằm giữa file (kiểu HEIC của iPhone): dò "Exif\0\0" + đầu TIFF
  const tiff = j.subarray(12, j.length - 2), heic = new Uint8Array(3000 + 10 + tiff.length);
  for (let i = 0; i < 3000; i++) heic[i] = (i * 31) & 255;
  heic.set([0, 0, 0, 6, 0x45, 0x78, 0x69, 0x66, 0, 0], 3000); heic.set(tiff, 3010);
  const rh = VN.docExif(heic); near(rh.lat, 16.6353123, 1e-7, "HEIC: vĩ độ"); near(rh.lon, 106.733012, 1e-7, "HEIC: kinh độ");
  const s = VN.ghiExif(new Uint8Array([0xff, 0xd8, 0xff, 0xd9]), { lat: -33.5, lon: -70.25, time: t });
  const r2 = VN.docExif(s.buffer); near(r2.lat, -33.5, 1e-9, "Nam"); near(r2.lon, -70.25, 1e-9, "Tây");
  const L = VN.dongChu({ lat: 16.6353, lon: 106.733, acc: 8.4 }, { lon0: 106.25, tinh: "Tỉnh/thành phố: Quảng Trị", time: t, ghichu: "Thửa 12" });
  const [x, y] = VN.wgs84ToVn2000(16.6353, 106.733, 0, 106.25);
  eq(L[0], "WGS84: 16.6353000, 106.7330000  (±8 m)", "dòng WGS84");
  eq(L[1].startsWith("VN-2000 KTT 106°15': X = "), true, "dòng VN-2000");
  eq(L[1].includes(x.toLocaleString("vi-VN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })), true, "X đúng hàm app");
  eq(L[L.length - 1], "Thửa 12", "ghi chú");
});

test("Nhận dạng toạ độ từ ảnh: tách, phân loại, ghép cặp theo vị trí chữ", () => {
  const W = (t, x, y) => ({ text: t, x0: x, y0: y, x1: x + t.length * 12, y1: y + 20, conf: 90 });
  // bố cục 2 cột như màn hình DJI RTK (cột máy bay, cột trạm RTK); lượt B đọc thiếu số → bỏ vì trùng vị trí
  const A = [W("16.753240601", 267, 1154), W("N", 420, 1154), W("16.753344127", 675, 1156), W("N", 830, 1156),
    W("106.593057412", 264, 1232), W("E", 430, 1232), W("106.593170198", 674, 1235), W("E", 840, 1235),
    W("676.421m", 260, 1310), W("573.974m", 672, 1314), W("11", 254, 1504)];
  const B = [W("6.593057412", 300, 1231)];
  const r = VN.ocrTimToaDo([A, B]);
  eq(r.wgs.length, 2, "2 điểm");
  near(r.wgs[0].lat, 16.753240601, 0, "lat 1"); near(r.wgs[0].lon, 106.593057412, 0, "lon 1"); near(r.wgs[0].h, 676.421, 0, "h 1");
  near(r.wgs[1].lat, 16.753344127, 0, "lat 2"); near(r.wgs[1].lon, 106.593170198, 0, "lon 2"); near(r.wgs[1].h, 573.974, 0, "h 2");
  // sổ đo VN-2000, số kiểu Việt và lỗi OCR O → 0
  const v = VN.ocrTimToaDo([W("X=", 10, 10), W("1.842.173,70", 40, 10), W("Y=", 220, 10), W("546243.5O", 250, 10)]);
  near(v.vn[0].x, 1842173.70, 1e-9, "X"); near(v.vn[0].y, 546243.50, 1e-9, "Y");
  // độ-phút-giây
  const d = VN.ocrTimToaDo([W("16°45'11.67\"N", 60, 10), W("106°35'35.01\"E", 60, 50)]);
  near(d.wgs[0].lat, 16 + 45 / 60 + 11.67 / 3600, 1e-9, "DMS lat"); near(d.wgs[0].lon, 106 + 35 / 60 + 35.01 / 3600, 1e-9, "DMS lon");
});

test("Ảnh Google: mức zoom tối đa theo maxZoomRects, địa chỉ ô ảnh", () => {
  const R = [{ maxZoom: 18, north: 17, south: 16, east: 107, west: 106 },
    { maxZoom: 21, north: 16.9, south: 16.7, east: 107.2, west: 107.0 },
    { maxZoom: 15, north: 10, south: -10, east: -170, west: 170 }];   // qua kinh tuyến 180
  eq(VN.gsatMaxZoomTai(R, 106.5, 16.5), 18, "trong ô 1");
  eq(VN.gsatMaxZoomTai(R, 107.05, 16.8), 21, "chồng ô → lấy mức cao nhất");
  eq(VN.gsatMaxZoomTai(R, 179.5, 0), 15, "qua kinh tuyến 180");
  eq(VN.gsatMaxZoomTai(R, 100, 50), 0, "ngoài mọi ô");
  eq(VN.gsatUrlO("a b", "K"), "https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=a%20b&key=K", "địa chỉ ô ảnh");
});

test("Ảnh trực giao: file world, GeoKey → hệ toạ độ, LZW, PackBits", () => {
  const a = VN.abDocWorld("0.05\n0\n0\n-0.05\n551000.025\n1839999.975\n");
  near(a[0], 551000, 1e-9, "world: X góc trái"); near(a[3], 1840000, 1e-9, "world: Y góc trên"); eq(a[1], 0.05, "cỡ điểm ảnh"); eq(a[5], -0.05, "cỡ điểm ảnh Y");
  let loi = ""; try { VN.abDocWorld("1 2 3"); } catch (e) { loi = e.message; } eq(/6 dòng/.test(loi), true, "world thiếu dòng");
  eq(VN.abDoanCrs({ 3072: 9212 }).lon0, 106.25, "EPSG:9212 → KTT 106°15'");
  eq(VN.abDoanCrs({ 3072: 9218 }).lon0, 108.5, "EPSG:9218 → KTT 108°30'");
  eq(VN.abDoanCrs({ 3072: 32767, 3075: 1, 3080: 107.75, 3092: 0.9999 }).lon0, 107.75, "TM tự khai báo");
  eq(!!VN.abDoanCrs({ 3072: 32648 }).loi, true, "WGS84 UTM → báo chưa hỗ trợ");
  eq(!!VN.abDoanCrs({ 3072: 3405 }).loi, true, "VN-2000 UTM → báo");
  eq(VN.abDoanCrs({ 2048: 4326, 1024: 2 }).crs, "wgs84", "WGS84 độ");
  eq(VN.abDoanCrs({}, 'PROJCS["VN_2000_TM3",GEOGCS["GCS_VN_2000"],PROJECTION["Transverse_Mercator"],PARAMETER["central_meridian",106.25],PARAMETER["scale_factor",0.9999]]').lon0, 106.25, ".prj ESRI");
  eq(VN.abDoanTuPhamVi([551000, 1839900, 551150, 1840000]), "vn2000", "đoán VN-2000 theo phạm vi");
  eq(VN.abDoanTuPhamVi([106.7, 16.6, 106.8, 16.7]), "wgs84", "đoán WGS84 theo phạm vi");
  // LZW kiểu TIFF: mã 256 (xoá), 65 'A', 66 'B', 258 ('AB'), 257 (hết) — 9 bit/mã, bit cao trước
  const codes = [256, 65, 66, 258, 257]; let bits = ""; codes.forEach((c) => { bits += c.toString(2).padStart(9, "0"); });
  while (bits.length % 8) bits += "0";
  const src = new Uint8Array(bits.length / 8).map((_, i) => parseInt(bits.substr(i * 8, 8), 2));
  eq(new TextDecoder().decode(VN.abLzw(src, 4)), "ABAB", "giải nén LZW");
  eq(Array.from(VN.abPackbits(new Uint8Array([2, 1, 2, 3, 0xfe, 9]), 6)).join(","), "1,2,3,9,9,9", "giải nén PackBits");
});
