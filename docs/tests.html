<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm thử WebGIS</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  .pass { color: #0a7d32; } .fail { color: #b00020; font-weight: 600; }
  #summary { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/geographiclib-geodesic@2.0.0/geographiclib-geodesic.min.js"></script>
<script src="js/converter.js?v=2026.11.26f"></script>
<script src="js/parse.js?v=2026.11.26f"></script>
<script src="js/geo.js?v=2026.11.26f"></script>
<script src="js/export.js?v=2026.11.26f"></script>
</head>
<body>
<div id="summary">Đang chạy…</div>
<ol id="out"></ol>
<script>
/* Giá trị chốt lấy từ thuật toán Python (tests/test_converter.py) — hai bản phải khớp. */
const results = [];
function test(name, fn) {
  try { fn(); results.push([name, true, ""]); }
  catch (e) { results.push([name, false, e.message]); }
}
function near(a, b, tol, label) {
  if (!(Math.abs(a - b) <= tol)) throw new Error(`${label}: ${a} ≠ ${b} (sai số cho phép ${tol})`);
}
function eq(a, b, label) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error(`${label}: ${A} ≠ ${B}`);
}

const LON0 = 106.25;
const SAMPLES = [[1850000, 520000, 10], [1840000, 480000, 300], [1860500, 505250, 0]];

test("Kết quả chốt khớp bản Python", () => {
  for (const [x, y, h, lat, lon] of [
    [1850000, 520000, 10, 16.72672282, 106.43940148],
    [1840000, 480000, 300, 16.63635531, 106.06435322],
  ]) {
    const r = VN.vn2000ToWgs84(x, y, h, LON0);
    near(r[0], lat, 1e-7, "lat"); near(r[1], lon, 1e-7, "lon");
  }
});

test("Khứ hồi VN2000 → WGS84 → VN2000 sai số < 5 mm", () => {
  for (const [x, y, h] of SAMPLES) {
    const [lat, lon, hw] = VN.vn2000ToWgs84(x, y, h, LON0);
    const [x2, y2, h2] = VN.wgs84ToVn2000(lat, lon, hw, LON0);
    near(x2, x, 0.005, "x"); near(y2, y, 0.005, "y"); near(h2, h, 0.005, "h");
  }
});

test("Điểm trên kinh tuyến trục", () => {
  near(VN.vn2000ToWgs84(1850000, 500000, 0, LON0)[1], LON0, 0.01, "lon");
});

test("parseCoordinates: STT X Y H", () => {
  const r = VN.parseCoordinates("1 1850000 520000 10");
  eq(r.points, [["1", 1850000, 520000, 10]], "points"); eq(r.errors, [], "errors");
});
test("parseCoordinates: dòng trống không làm hỏng", () => {
  eq(VN.parseCoordinates("1 1850000 520000 10\n\n2 1850010 520010 10").points.map(p => p[0]), ["1", "2"], "tên");
});
test("parseCoordinates: định dạng N/E", () => {
  eq(VN.parseCoordinates("N01850000 E00520000").points[0].slice(1, 3), [1850000, 520000], "xy");
});
test("parseCoordinates: loại điểm ngoài miền", () => {
  const r = VN.parseCoordinates("1 100 200 0");
  eq(r.points, [], "points"); eq(r.errors.length, 1, "errors");
});
test("parseCoordinates: X=/Y= tự đảo khi nhập ngược", () => {
  eq(VN.parseCoordinates("X=520000\nY=1850000").points[0].slice(1, 3), [1850000, 520000], "xy");
});
test("parseCoordinates: 3 dòng đơn", () => {
  eq(VN.parseCoordinates("1850000\n520000\n10").points, [["Điểm 1", 1850000, 520000, 10]], "points");
});

test("parseWgs84: lat lon không có H", () => {
  const r = VN.parseWgs84("16.70 106.60\n16.71 106.61");
  eq(r.points, [["1", 16.7, 106.6, 0], ["2", 16.71, 106.61, 0]], "points"); eq(r.errors, [], "errors");
});
test("parseWgs84: có H và tên", () => {
  eq(VN.parseWgs84("M1 16.70 106.60 12.5\nM2, 16.71, 106.61").points,
     [["M1", 16.7, 106.6, 12.5], ["M2", 16.71, 106.61, 0]], "points");
});
test("parseWgs84: báo lỗi dòng sai", () => {
  const r = VN.parseWgs84("16.70 106.60\nabc\n95 106.6");
  eq(r.points.length, 1, "points"); eq(r.errors.length, 2, "errors");
});

test("Shoelace: hình vuông 20 m = 400 m²", () => {
  near(VN.shoelaceArea([[0, 0], [20, 0], [20, 20], [0, 20]]), 400, 1e-9, "area");
});
test("Diện tích WGS84 ≈ diện tích VN2000 (thửa 100 m × 100 m)", () => {
  const xy = [[1850000, 520000], [1850100, 520000], [1850100, 520100], [1850000, 520100]];
  const ll = xy.map(([x, y]) => VN.vn2000ToWgs84(x, y, 0, LON0).slice(0, 2));
  const a1 = VN.shoelaceArea(xy), a2 = VN.geodesicArea(ll);
  near(a2 / a1, 1, 0.002, "tỉ lệ");   // khác nhau do hệ số k0 & biến dạng phép chiếu
});
test("Độ dài cạnh WGS84 ≈ 100 m", () => {
  const [a, b] = [[1850000, 520000], [1850100, 520000]].map(([x, y]) => VN.vn2000ToWgs84(x, y, 0, LON0));
  near(VN.geodesicDistance(a[0], a[1], b[0], b[1]), 100, 0.05, "s12");
});
test("Điểm trong đa giác (có lỗ, MultiPolygon)", () => {
  const sq = (a, b) => [[a, a], [b, a], [b, b], [a, b], [a, a]];
  const poly = { type: "Polygon", coordinates: [sq(0, 10), sq(4, 6)] };   // vuông 10×10, lỗ 2×2 ở giữa
  eq(VN.pointInGeometry(1, 1, poly), true, "trong");
  eq(VN.pointInGeometry(5, 5, poly), false, "trong lỗ");
  eq(VN.pointInGeometry(11, 5, poly), false, "ngoài");
  const multi = { type: "MultiPolygon", coordinates: [[sq(0, 1)], [sq(5, 6)]] };
  eq(VN.pointInGeometry(5.5, 5.5, multi), true, "phần thứ 2");
});
test("Sắp tên điểm theo số", () => {
  eq(["10", "2", "B", "1", "a"].sort(VN.comparePointNames), ["1", "2", "10", "a", "B"], "thứ tự");
});
test("DXF có đủ thực thể và ghi tên tiếng Việt dạng \\U+", () => {
  const d = VN.toDxf([{ name: "Điểm 1", x: 1850000, y: 520000 }]);
  eq((d.match(/\r\nLINE\r\n/g) || []).length, 2, "LINE");
  if (!d.includes("\\U+0110i\\U+1EC3m 1")) throw new Error("tên không mã hoá đúng");
  if (!d.trim().endsWith("EOF")) throw new Error("thiếu EOF");
});
test("KML đúng thứ tự lon,lat", () => {
  const k = VN.toKml([{ name: "A&B", lat: 16.7, lon: 106.6, hw: 5 }]);
  if (!k.includes("<coordinates>106.6,16.7,5</coordinates>")) throw new Error("toạ độ sai");
  if (!k.includes("A&amp;B")) throw new Error("chưa escape");
});

const out = document.getElementById("out");
for (const [name, ok, msg] of results) {
  const li = document.createElement("li");
  li.className = ok ? "pass" : "fail";
  li.textContent = (ok ? "✔ " : "✘ ") + name + (msg ? " — " + msg : "");
  out.appendChild(li);
}
const failed = results.filter(r => !r[1]).length;
const s = document.getElementById("summary");
s.textContent = failed ? `${failed}/${results.length} TEST LỖI` : `Tất cả ${results.length} test đều đạt`;
s.className = failed ? "fail" : "pass";
</script>
</body>
</html>
